services:
  postgres:
    image: postgres:16-alpine
    container_name: docrepo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docrepo
      POSTGRES_PASSWORD: docrepo_dev_password
      POSTGRES_DB: docrepo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docrepo -d docrepo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: docrepo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata: