services:
  postgres:
    image: postgres:16-alpine
    container_name: docrepo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docrepo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docrepo_dev_password}
      POSTGRES_DB: docrepo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docrepo -d docrepo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: docrepo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: docrepo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # inside the Compose network the services are reached by name, not localhost
      DATABASE_URL: postgresql://docrepo:${POSTGRES_PASSWORD:-docrepo_dev_password}@postgres:5432/docrepo
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-before-deploying}
      JWT_EXPIRES_IN: 1d
      UPLOAD_DIR: /data/uploads
      MAX_FILE_SIZE_MB: 25
      CORS_ORIGIN: http://localhost:3000
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: docrepo-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  uploads: